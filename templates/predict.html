<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Machine Prediction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container py-5">

    <div class="text-center mb-4">
        <h1>AI Predictive Maintenance</h1>
        <p class="text-muted">
            Enter machine sensor values to predict machine failure.
        </p>
    </div>

    {% if error %}
    <div class="alert alert-danger">
        <strong>Error:</strong> {{ error }}
    </div>
    {% endif %}

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h3 class="mb-4">Machine Sensor Information</h3>

            <form method="POST" action="/predict/">

                <!-- Product Type -->
                <div class="mb-3">
                    <label for="Type" class="form-label">
                        Product Type
                    </label>

                    <select
                        class="form-select"
                        id="Type"
                        name="Type"
                        required
                    >
                        <option value="">Select Product Type</option>
                        <option value="L">L - Low</option>
                        <option value="M">M - Medium</option>
                        <option value="H">H - High</option>
                    </select>
                </div>

                <!-- Air Temperature -->
                <div class="mb-3">
                    <label
                        for="air_temperature"
                        class="form-label"
                    >
                        Air Temperature [K]
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        id="air_temperature"
                        name="Air temperature [K]"
                        placeholder="Example: 300.0"
                        required
                    >
                </div>

                <!-- Process Temperature -->
                <div class="mb-3">
                    <label
                        for="process_temperature"
                        class="form-label"
                    >
                        Process Temperature [K]
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        id="process_temperature"
                        name="Process temperature [K]"
                        placeholder="Example: 310.0"
                        required
                    >
                </div>

                <!-- Rotational Speed -->
                <div class="mb-3">
                    <label
                        for="rotational_speed"
                        class="form-label"
                    >
                        Rotational Speed [rpm]
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        id="rotational_speed"
                        name="Rotational speed [rpm]"
                        placeholder="Example: 1500"
                        required
                    >
                </div>

                <!-- Torque -->
                <div class="mb-3">
                    <label
                        for="torque"
                        class="form-label"
                    >
                        Torque [Nm]
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        id="torque"
                        name="Torque [Nm]"
                        placeholder="Example: 40"
                        required
                    >
                </div>

                <!-- Tool Wear -->
                <div class="mb-4">
                    <label
                        for="tool_wear"
                        class="form-label"
                    >
                        Tool Wear [min]
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        id="tool_wear"
                        name="Tool wear [min]"
                        placeholder="Example: 100"
                        required
                    >
                </div>

                <div class="d-grid gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg"
                    >
                        Predict Machine Failure
                    </button>

                    <a
                        href="/history"
                        class="btn btn-secondary btn-lg"
                    >
                        View Prediction History
                    </a>
                    <a
                        href="/dashboard"
                        class="btn btn-dark"
                    >                   
                        Dashboard
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
